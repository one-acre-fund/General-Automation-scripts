name: Migrate ACR to ECR (Batch 2)

on:
  workflow_dispatch:
    inputs:
      filter_repo:
        description: 'Migrate only this ACR repo (e.g. oneacrefund/odoo). Leave blank for all.'
        required: false
        default: ''
        type: string
      max_parallel:
        description: 'Number of tags to copy in parallel'
        required: false
        default: '10'
        type: string
      force_recopy:
        description: 'Force re-copy even if tag already exists in ECR (fixes tags previously copied without full image index)'
        required: false
        default: 'false'
        type: string

# ACR is READ-ONLY (source) throughout this workflow.
# Only az acr repository show-tags (list) and skopeo copy SOURCE pull are used.
# No az acr repository delete, docker push to ACR, or any ACR write command is present.
permissions:
  id-token: write
  contents: write

env:
  MAPPING_FILE: acr-ecr-mapping-batch2.json

jobs:
  migrate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to Azure Container Registry (read-only — pull source images only)
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Docker Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Install skopeo (ensure latest)
        run: |
          skopeo --version
          echo "skopeo ready."

      - name: Migrate images using mapping file
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          ECR="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          MAX_PARALLEL="${{ inputs.max_parallel }}"
          FILTER_REPO="${{ inputs.filter_repo }}"

          export AWS_REGION_VAR="${{ vars.AWS_REGION }}"
          export ACR_REG="$ACR"
          export ECR_REG="$ECR"
          export AZURE_ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          export FORCE_RECOPY="${{ inputs.force_recopy }}"

          WORK_FILE=$(mktemp)
          ERROR_FILE=$(mktemp)
          export ERROR_FILE

          # ── Phase 1: fetch all tags sequentially (avoids ACR rate limiting) ──
          echo "==> Phase 1: Fetching tags from ACR (mapping: ${MAPPING_FILE})..."
          repo_count=0
          skipped_repos=0

          while IFS= read -r item; do
            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            if [ -n "$FILTER_REPO" ] && [ "$acr_repo" != "$FILTER_REPO" ]; then
              continue
            fi

            acr_err_tmp=$(mktemp)
            tags=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" \
              --repository "${acr_repo}" \
              --output tsv 2>"$acr_err_tmp") || true

            if [ -z "$tags" ]; then
              if grep -qi "not found\|does not exist\|repository.*not found\|No repository" "$acr_err_tmp" 2>/dev/null; then
                echo "WARNING: [${acr_repo}] Does not exist in ACR, skipping."
              else
                echo "WARNING: [${acr_repo}] No tags found (empty repo), skipping."
              fi
              rm -f "$acr_err_tmp"
              skipped_repos=$((skipped_repos + 1))
              continue
            fi
            rm -f "$acr_err_tmp"

            tag_count=0
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              printf '%s\t%s\t%s\n' "${acr_repo}" "${ecr_repo}" "${tag}" >> "$WORK_FILE"
              tag_count=$((tag_count + 1))
            done <<< "$tags"
            echo "    [${acr_repo}] ${tag_count} tags queued"
            repo_count=$((repo_count + 1))
          done < <(jq -c '.[]' "$MAPPING_FILE")

          total=$(wc -l < "$WORK_FILE" | tr -d ' ')
          echo ""
          echo "==> Phase 1 complete: ${repo_count} repos, ${total} tags queued, ${skipped_repos} repos skipped."

          if [ "$total" -eq 0 ]; then
            echo "Nothing to migrate. Exiting."
            rm -f "$WORK_FILE" "$ERROR_FILE"
            exit 0
          fi

          # ── Pre-create all ECR repos sequentially ──
          echo ""
          echo "==> Pre-creating missing ECR repositories..."
          cut -f2 "$WORK_FILE" | sort -u | while IFS= read -r ecr_repo; do
            if ! aws ecr describe-repositories --repository-names "${ecr_repo}" \
                --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
              if aws ecr create-repository --repository-name "${ecr_repo}" \
                  --region "$AWS_REGION_VAR" \
                  --image-scanning-configuration scanOnPush=true > /dev/null 2>&1; then
                echo "    Created ECR repo: ${ecr_repo}"
              else
                echo "WARNING: Could not create ECR repo ${ecr_repo}"
              fi
            fi
          done

          # ── Phase 2: copy tags in parallel ──
          echo ""
          echo "==> Phase 2: Copying tags (parallel=${MAX_PARALLEL})..."

          copy_tag() {
            local acr_repo ecr_repo tag src dst

            acr_repo=$(printf '%s' "$1" | cut -f1)
            ecr_repo=$(printf '%s' "$1" | cut -f2)
            tag=$(printf '%s' "$1" | cut -f3)
            src="${ACR_REG}/${acr_repo}:${tag}"
            dst="${ECR_REG}/${ecr_repo}:${tag}"

            if [ "${FORCE_RECOPY}" != "true" ]; then
              if aws ecr describe-images \
                  --repository-name "${ecr_repo}" \
                  --image-ids imageTag="${tag}" \
                  --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
                echo "    [${acr_repo}:${tag}] Already in ECR, skipping."
                return 0
              fi
            fi

            echo "    [${acr_repo}] Copying :${tag}..."
            if skopeo copy --all \
                "docker://${src}" \
                "docker://${dst}" 2>&1; then
              echo "    [${acr_repo}:${tag}] OK"
            else
              msg="ERROR: [${acr_repo}:${tag}] skopeo copy failed."
              echo "$msg"
              echo "$msg" >> "$ERROR_FILE"
            fi
          }

          export -f copy_tag

          active=0
          while IFS= read -r line; do
            copy_tag "$line" &
            active=$((active + 1))
            if [ "$active" -ge "$MAX_PARALLEL" ]; then
              wait -n 2>/dev/null || wait
              active=$((active - 1))
            fi
          done < "$WORK_FILE"

          wait
          rm -f "$WORK_FILE"

          # ── Phase 3: copy untagged/orphaned ACR manifests by digest ──
          echo ""
          echo "==> Phase 3: Syncing untagged/orphaned ACR manifests by digest..."

          while IFS= read -r item; do
            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            if [ -n "$FILTER_REPO" ] && [ "$acr_repo" != "$FILTER_REPO" ]; then
              continue
            fi

            acr_digests=$(az acr repository show-manifests \
              --name "$AZURE_ACR_NAME" \
              --repository "${acr_repo}" \
              --detail \
              --output json 2>/dev/null \
              | jq -r '.[].digest' 2>/dev/null || true)

            [ -z "$acr_digests" ] && continue

            while IFS= read -r digest; do
              [ -z "$digest" ] && continue

              exists=$(aws ecr batch-get-image \
                --repository-name "${ecr_repo}" \
                --image-ids imageDigest="${digest}" \
                --region "$AWS_REGION_VAR" \
                --output json 2>/dev/null \
                | jq '.images | length' 2>/dev/null || echo 0)

              if [ "${exists:-0}" -gt 0 ]; then
                continue
              fi

              echo "    [${acr_repo}@${digest:7:12}] Copying untagged manifest..."
              if skopeo copy --all \
                  "docker://${ACR_REG}/${acr_repo}@${digest}" \
                  "docker://${ECR_REG}/${ecr_repo}@${digest}" 2>&1; then
                echo "    [${acr_repo}@${digest:7:12}] OK"
              else
                echo "WARNING: [${acr_repo}@${digest:7:12}] skopeo copy failed (orphaned manifest may have missing layers, skipping)."
              fi
            done <<< "$acr_digests"
          done < <(jq -c '.[]' "$MAPPING_FILE")

          echo "==> Phase 3 complete."

          # ── Final summary ──
          echo ""
          echo "========================================"
          if [ -s "$ERROR_FILE" ]; then
            fail_count=$(wc -l < "$ERROR_FILE" | tr -d ' ')
            echo "==> Migration finished with ${fail_count} FAILED tag(s):"
            cat "$ERROR_FILE"
            rm -f "$ERROR_FILE"
            exit 1
          else
            echo "==> All tags migrated successfully."
            rm -f "$ERROR_FILE"
          fi
          echo "========================================"

      - name: Re-authenticate Azure (token may have expired during long migration)
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate ACR vs ECR comparison CSV
        if: always()
        run: |
          echo "Run the 'ACR vs ECR Comparison Report' workflow with mapping_file=acr-ecr-mapping-batch2.json to get the full report."
