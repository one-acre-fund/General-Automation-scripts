name: ACR vs ECR Comparison Report

on:
  workflow_dispatch:
    inputs:
      mapping_file:
        description: 'Mapping JSON file to use'
        required: false
        default: 'acr-ecr-mapping.json'
        type: string
      filter_repo:
        description: 'Compare only this repo (e.g. airflow). Leave blank for all.'
        required: false
        default: ''
        type: string

# Read-only: no writes to ACR or ECR.
# Uses: az acr repository show (manifestCount + tagCount), aws ecr list-images (tag lists)
permissions:
  id-token: write
  contents: write   # needed only to commit the CSV report

jobs:
  compare-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate ACR vs ECR comparison CSV
        run: |
          MAPPING_FILE="${{ inputs.mapping_file }}"
          AZURE_ACR_NAME_VAR="${{ vars.AZURE_ACR_NAME }}"
          AWS_REGION_VAR="${{ vars.AWS_REGION }}"
          FILTER_REPO="${{ inputs.filter_repo }}"
          REPORT_FILE="acr-ecr-comparison-$(date -u '+%Y%m%d-%H%M%S').csv"
          DETAIL_FILE="acr-ecr-detail-$(date -u '+%Y%m%d-%H%M%S').txt"

          # ── Summary CSV ──
          # Per-repo: actual set comparison of tags AND manifest digests
          # acr_tags_missing_from_ecr = ACR tags not present in ECR  → must be 0 for full sync
          # ecr_only_tags             = ECR tags not in ACR           → informational
          # acr_manifests_missing     = ACR digest not in ECR         → must be 0 for full sync
          # ecr_only_manifests        = ECR digests not in ACR        → informational (ecr-only tag children)
          echo "acr_repo,ecr_repo,acr_tags,ecr_tags,acr_tags_missing_from_ecr,ecr_only_tags,tags_synced,acr_manifests,ecr_manifests,acr_manifests_missing_from_ecr,ecr_only_manifests,manifests_synced" > "$REPORT_FILE"

          {
            echo "ACR vs ECR Detailed Comparison"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Mapping:   ${MAPPING_FILE}"
            echo "============================================================"
          } > "$DETAIL_FILE"

          total_repos=0
          mismatch_count=0
          total_acr_tags=0; total_ecr_tags=0
          total_acr_manifests=0; total_ecr_manifests=0
          total_acr_tags_missing=0; total_ecr_only_tags=0
          total_acr_manifests_missing=0; total_ecr_only_manifests=0

          printf '\n%-40s %9s %9s %12s %10s %11s %13s %13s %16s %18s %16s\n' \
            "REPO" "ACR_TAGS" "ECR_TAGS" "TAGS_MISSING" "ECR_ONLY_T" \
            "TAGS_SYNCED" "ACR_MANIFESTS" "ECR_MANIFESTS" "MANIFEST_MISSING" "ECR_ONLY_MANIFESTS" "MANIFEST_SYNCED"
          printf '%0.s-' {1..180}; echo

          while IFS= read -r item <&3; do
            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            if [ -n "$FILTER_REPO" ] && [ "$acr_repo" != "$FILTER_REPO" ]; then
              continue
            fi

            {
              echo ""
              echo "REPO: ${acr_repo}"
              echo "------------------------------------------------------------"
            } >> "$DETAIL_FILE"

            # ── ACR: get all tags ──
            acr_tags_sorted=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME_VAR" \
              --repository "${acr_repo}" \
              --output tsv 2>/dev/null | sort || true)
            acr_tag_count=$(echo "$acr_tags_sorted" | grep -c . 2>/dev/null || echo 0)
            [ -z "$acr_tags_sorted" ] && acr_tag_count=0

            # ── ACR: get all manifest digests ──
            acr_digests_sorted=$(az acr repository show-manifests \
              --name "$AZURE_ACR_NAME_VAR" \
              --repository "${acr_repo}" \
              --detail \
              --output json 2>/dev/null \
              | jq -r '.[].digest' 2>/dev/null | sort || true)
            acr_manifest_count=$(echo "$acr_digests_sorted" | grep -c . 2>/dev/null || echo 0)
            [ -z "$acr_digests_sorted" ] && acr_manifest_count=0

            # ── ECR: get all tags ──
            ecr_all=$(aws ecr list-images \
              --repository-name "${ecr_repo}" \
              --region "$AWS_REGION_VAR" \
              --filter tagStatus=ANY \
              --output json 2>/dev/null || echo '{"imageIds":[]}')

            ecr_tags_sorted=$(echo "$ecr_all" \
              | jq -r '.imageIds[] | select(.imageTag != null) | .imageTag' \
              2>/dev/null | sort || true)
            ecr_tag_count=$(echo "$ecr_tags_sorted" | grep -c . 2>/dev/null || echo 0)
            [ -z "$ecr_tags_sorted" ] && ecr_tag_count=0

            # ── ECR: get all manifest digests ──
            ecr_digests_sorted=$(echo "$ecr_all" \
              | jq -r '.imageIds[] | select(.imageDigest != null) | .imageDigest' \
              2>/dev/null | sort -u || true)
            ecr_manifest_count=$(echo "$ecr_digests_sorted" | grep -c . 2>/dev/null || echo 0)
            [ -z "$ecr_digests_sorted" ] && ecr_manifest_count=0

            # ── Tag set diff ──
            acr_tags_missing=$(comm -23 \
              <(echo "$acr_tags_sorted") \
              <(echo "$ecr_tags_sorted") 2>/dev/null || true)
            ecr_only_tags=$(comm -13 \
              <(echo "$acr_tags_sorted") \
              <(echo "$ecr_tags_sorted") 2>/dev/null || true)
            acr_tags_missing_count=$(echo "$acr_tags_missing" | grep -c . 2>/dev/null || echo 0)
            ecr_only_tags_count=$(echo "$ecr_only_tags" | grep -c . 2>/dev/null || echo 0)
            [ -z "$acr_tags_missing" ] && acr_tags_missing_count=0
            [ -z "$ecr_only_tags" ] && ecr_only_tags_count=0

            # ── Manifest digest set diff ──
            acr_manifests_missing=$(comm -23 \
              <(echo "$acr_digests_sorted") \
              <(echo "$ecr_digests_sorted") 2>/dev/null || true)
            ecr_only_manifests=$(comm -13 \
              <(echo "$acr_digests_sorted") \
              <(echo "$ecr_digests_sorted") 2>/dev/null || true)
            acr_manifests_missing_count=$(echo "$acr_manifests_missing" | grep -c . 2>/dev/null || echo 0)
            ecr_only_manifests_count=$(echo "$ecr_only_manifests" | grep -c . 2>/dev/null || echo 0)
            [ -z "$acr_manifests_missing" ] && acr_manifests_missing_count=0
            [ -z "$ecr_only_manifests" ] && ecr_only_manifests_count=0

            # ── Sync status ──
            [ "$acr_tags_missing_count" -eq 0 ]      && tags_synced="YES"      || tags_synced="NO"
            [ "$acr_manifests_missing_count" -eq 0 ] && manifests_synced="YES" || manifests_synced="NO"

            # ── Detail file ──
            {
              echo "  ACR tags    : ${acr_tag_count}   ECR tags    : ${ecr_tag_count}"
              echo "  ACR manifests: ${acr_manifest_count}   ECR manifests: ${ecr_manifest_count}"
              echo ""
              if [ "$acr_tags_missing_count" -gt 0 ]; then
                echo "  TAGS IN ACR BUT MISSING FROM ECR (${acr_tags_missing_count}):"
                echo "$acr_tags_missing" | sed 's/^/    /'
              else
                echo "  TAGS: All ACR tags present in ECR ✓"
              fi
              echo ""
              if [ "$ecr_only_tags_count" -gt 0 ]; then
                echo "  TAGS IN ECR ONLY — not in ACR (${ecr_only_tags_count}):"
                echo "$ecr_only_tags" | sed 's/^/    /'
              fi
              echo ""
              if [ "$acr_manifests_missing_count" -gt 0 ]; then
                echo "  MANIFESTS IN ACR BUT MISSING FROM ECR (${acr_manifests_missing_count}):"
                echo "$acr_manifests_missing" | sed 's/^/    /'
              else
                echo "  MANIFESTS: All ACR manifests present in ECR ✓"
              fi
              echo ""
              if [ "$ecr_only_manifests_count" -gt 0 ]; then
                echo "  MANIFESTS IN ECR ONLY — not in ACR (${ecr_only_manifests_count}):"
                echo "$ecr_only_manifests" | sed 's/^/    /'
              fi
            } >> "$DETAIL_FILE"

            # ── Mismatch warning ──
            if [ "$tags_synced" != "YES" ] || [ "$manifests_synced" != "YES" ]; then
              mismatch_count=$((mismatch_count + 1))
              echo "::warning::MISMATCH [${acr_repo}] tags_missing=${acr_tags_missing_count} manifests_missing=${acr_manifests_missing_count}"
            fi

            # ── CSV row ──
            echo "${acr_repo},${ecr_repo},${acr_tag_count},${ecr_tag_count},${acr_tags_missing_count},${ecr_only_tags_count},${tags_synced},${acr_manifest_count},${ecr_manifest_count},${acr_manifests_missing_count},${ecr_only_manifests_count},${manifests_synced}" >> "$REPORT_FILE"

            printf '%-40s %9s %9s %12s %10s %11s %13s %13s %16s %18s %16s\n' \
              "${acr_repo}" "${acr_tag_count}" "${ecr_tag_count}" \
              "${acr_tags_missing_count}" "${ecr_only_tags_count}" "${tags_synced}" \
              "${acr_manifest_count}" "${ecr_manifest_count}" \
              "${acr_manifests_missing_count}" "${ecr_only_manifests_count}" "${manifests_synced}"

            total_repos=$((total_repos + 1))
            total_acr_tags=$((total_acr_tags + acr_tag_count))
            total_ecr_tags=$((total_ecr_tags + ecr_tag_count))
            total_acr_manifests=$((total_acr_manifests + acr_manifest_count))
            total_ecr_manifests=$((total_ecr_manifests + ecr_manifest_count))
            total_acr_tags_missing=$((total_acr_tags_missing + acr_tags_missing_count))
            total_ecr_only_tags=$((total_ecr_only_tags + ecr_only_tags_count))
            total_acr_manifests_missing=$((total_acr_manifests_missing + acr_manifests_missing_count))
            total_ecr_only_manifests=$((total_ecr_only_manifests + ecr_only_manifests_count))

          done 3< <(jq -c '.[]' "$MAPPING_FILE")

          # TOTAL summary row
          echo "TOTAL,,${total_acr_tags},${total_ecr_tags},${total_acr_tags_missing},${total_ecr_only_tags},,${total_acr_manifests},${total_ecr_manifests},${total_acr_manifests_missing},${total_ecr_only_manifests}," >> "$REPORT_FILE"

          printf '%0.s-' {1..180}; echo
          printf '%-40s %9s %9s %12s %10s %13s %13s %16s %18s\n' \
            "TOTAL" "${total_acr_tags}" "${total_ecr_tags}" \
            "${total_acr_tags_missing}" "${total_ecr_only_tags}" \
            "${total_acr_manifests}" "${total_ecr_manifests}" \
            "${total_acr_manifests_missing}" "${total_ecr_only_manifests}"

          echo ""
          echo "========================================"
          echo "Total repos compared         : ${total_repos}"
          echo "Repos fully synced           : $((total_repos - mismatch_count))"
          echo "Repos with missing content   : ${mismatch_count}"
          echo ""
          echo "ACR tags total               : ${total_acr_tags}"
          echo "ECR tags total               : ${total_ecr_tags}"
          echo "ACR tags MISSING from ECR    : ${total_acr_tags_missing}  ← must be 0"
          echo "ECR-only tags (not in ACR)   : ${total_ecr_only_tags}   (extra pushes)"
          echo ""
          echo "ACR manifests total          : ${total_acr_manifests}"
          echo "ECR manifests total          : ${total_ecr_manifests}"
          echo "ACR manifests MISSING in ECR : ${total_acr_manifests_missing}  ← must be 0"
          echo "ECR-only manifests (not ACR) : ${total_ecr_only_manifests}   (children of ecr-only tags)"
          echo ""
          echo "Summary CSV  : ${REPORT_FILE}"
          echo "Detail file  : ${DETAIL_FILE}"
          echo "========================================"

          echo "REPORT_FILE=${REPORT_FILE}" >> "$GITHUB_ENV"
          echo "DETAIL_FILE=${DETAIL_FILE}" >> "$GITHUB_ENV"

          if [ "$mismatch_count" -gt 0 ]; then
            echo "::error::${mismatch_count} repo(s) have ACR content missing from ECR."
            exit 1
          fi

      - name: Commit and push comparison report
        if: always()
        run: |
          if [ -z "${REPORT_FILE}" ] || [ ! -f "${REPORT_FILE}" ]; then
            echo "No report file found, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${REPORT_FILE}"
          [ -f "${DETAIL_FILE}" ] && git add "${DETAIL_FILE}"
          git diff --cached --quiet && echo "Nothing to commit." && exit 0
          git commit -m "chore: add ACR→ECR comparison report ${REPORT_FILE} [skip ci]"
          git pull --rebase
          git push
