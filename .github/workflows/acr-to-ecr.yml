name: Migrate ACR Images to ECR (Mapping File)

on:
  workflow_dispatch:
    inputs:
      mapping_file:
        description: 'Mapping JSON file to use'
        required: false
        default: 'acr-ecr-mapping.json'
        type: string
      filter_repo:
        description: 'Migrate only this ACR repo (e.g. openfaas/faas-netes). Leave blank for all.'
        required: false
        default: ''
        type: string
      max_parallel:
        description: 'Number of tags to copy in parallel'
        required: false
        default: '10'
        type: string

# ACR is READ-ONLY (source) throughout this workflow.
# Only az acr repository show-tags (list) and oras copy SOURCE pull are used.
# No az acr repository delete, docker push to ACR, or any ACR write command is present.
permissions:
  id-token: write
  contents: write   # needed only to commit the README summary — not related to ACR

jobs:
  migrate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to Azure Container Registry (read-only — pull source images only)
        # ACR is the source. This login is used exclusively for oras copy SOURCE pull.
        # No docker push, az acr repository delete, or any write operation is performed on ACR.
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Docker Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Install oras
        run: |
          ORAS_VERSION="1.2.3"
          curl -sSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo mv oras /usr/local/bin/

      - name: Migrate images using mapping file
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          ECR="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          MAX_PARALLEL="${{ inputs.max_parallel }}"
          MAPPING_FILE="${{ inputs.mapping_file }}"
          FILTER_REPO="${{ inputs.filter_repo }}"

          export AWS_REGION_VAR="${{ vars.AWS_REGION }}"
          export ACR_REG="$ACR"
          export ECR_REG="$ECR"
          export AZURE_ACR_NAME="${{ vars.AZURE_ACR_NAME }}"

          WORK_FILE=$(mktemp)
          ERROR_FILE=$(mktemp)
          export ERROR_FILE

          # ── Phase 1: fetch all tags sequentially (avoids ACR rate limiting) ──
          echo "==> Phase 1: Fetching tags from ACR (mapping: ${MAPPING_FILE})..."
          repo_count=0
          skipped_repos=0

          while IFS= read -r item; do
            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            # Apply single-repo filter if set
            if [ -n "$FILTER_REPO" ] && [ "$acr_repo" != "$FILTER_REPO" ]; then
              continue
            fi

            tags=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" \
              --repository "${acr_repo}" \
              --output tsv 2>/tmp/acr_err.txt) || true

            if [ -z "$tags" ]; then
              if grep -qi "not found\|does not exist\|repository.*not found\|No repository" /tmp/acr_err.txt 2>/dev/null; then
                echo "WARNING: [${acr_repo}] Does not exist in ACR, skipping."
              else
                echo "WARNING: [${acr_repo}] No tags found (empty repo), skipping."
              fi
              skipped_repos=$((skipped_repos + 1))
              continue
            fi

            tag_count=0
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              # Use tab as delimiter — safe for all valid image tag characters
              printf '%s\t%s\t%s\n' "${acr_repo}" "${ecr_repo}" "${tag}" >> "$WORK_FILE"
              tag_count=$((tag_count + 1))
            done <<< "$tags"
            echo "    [${acr_repo}] ${tag_count} tags queued"
            repo_count=$((repo_count + 1))
          done < <(jq -c '.[]' "$MAPPING_FILE")

          total=$(wc -l < "$WORK_FILE" | tr -d ' ')
          echo ""
          echo "==> Phase 1 complete: ${repo_count} repos, ${total} tags queued, ${skipped_repos} repos skipped."

          if [ "$total" -eq 0 ]; then
            echo "Nothing to migrate. Exiting."
            rm -f "$WORK_FILE" "$ERROR_FILE"
            exit 0
          fi

          # ── Pre-create all ECR repos sequentially to avoid parallel race conditions ──
          echo ""
          echo "==> Pre-creating missing ECR repositories..."
          cut -f2 "$WORK_FILE" | sort -u | while IFS= read -r ecr_repo; do
            if ! aws ecr describe-repositories --repository-names "${ecr_repo}" \
                --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
              if aws ecr create-repository --repository-name "${ecr_repo}" \
                  --region "$AWS_REGION_VAR" \
                  --image-scanning-configuration scanOnPush=true > /dev/null 2>&1; then
                echo "    Created ECR repo: ${ecr_repo}"
              else
                echo "WARNING: Could not create ECR repo ${ecr_repo}"
              fi
            fi
          done

          # ── Phase 2: copy tags in parallel ──
          echo ""
          echo "==> Phase 2: Copying tags (parallel=${MAX_PARALLEL})..."

          copy_tag() {
            local acr_repo ecr_repo tag src dst

            acr_repo=$(printf '%s' "$1" | cut -f1)
            ecr_repo=$(printf '%s' "$1" | cut -f2)
            tag=$(printf '%s' "$1" | cut -f3)
            src="${ACR_REG}/${acr_repo}:${tag}"
            dst="${ECR_REG}/${ecr_repo}:${tag}"

            # Skip if tag already exists in ECR
            if aws ecr describe-images \
                --repository-name "${ecr_repo}" \
                --image-ids imageTag="${tag}" \
                --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
              echo "    [${acr_repo}:${tag}] Already in ECR, skipping."
              return 0
            fi

            echo "    [${acr_repo}] Copying :${tag}..."
            if oras copy "${src}" "${dst}"; then
              echo "    [${acr_repo}:${tag}] OK"
            else
              msg="ERROR: [${acr_repo}:${tag}] oras copy failed."
              echo "$msg"
              echo "$msg" >> "$ERROR_FILE"
            fi
          }

          export -f copy_tag

          active=0
          while IFS= read -r line; do
            copy_tag "$line" &
            active=$((active + 1))
            if [ "$active" -ge "$MAX_PARALLEL" ]; then
              wait -n 2>/dev/null || wait
              active=$((active - 1))
            fi
          done < "$WORK_FILE"

          wait
          rm -f "$WORK_FILE"

          # ── Final summary ──
          echo ""
          echo "========================================"
          if [ -s "$ERROR_FILE" ]; then
            fail_count=$(wc -l < "$ERROR_FILE" | tr -d ' ')
            echo "==> Migration finished with ${fail_count} FAILED tag(s):"
            cat "$ERROR_FILE"
            rm -f "$ERROR_FILE"
            exit 1
          else
            echo "==> All tags migrated successfully."
            rm -f "$ERROR_FILE"
          fi
          echo "========================================"

      - name: Generate migration summary README
        if: always() && inputs.filter_repo == ''
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          ECR="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          MAPPING_FILE="${{ inputs.mapping_file }}"

          {
            echo "# ACR → ECR Migration Summary"
            echo ""
            echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Mapping file: \`${MAPPING_FILE}\`"
            echo ""
            echo "| Source ACR Repository | Target ECR Repository | Images in ECR |"
            echo "|---|---|---|"

            while IFS= read -r item; do
              acr_repo=$(echo "$item" | jq -r '.acr_repo')
              ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

              image_count=$(aws ecr list-images \
                --repository-name "${ecr_repo}" \
                --region ${{ vars.AWS_REGION }} \
                --filter tagStatus=TAGGED \
                --output json 2>/dev/null \
                | jq -r '(.imageIds // []) | length' 2>/dev/null)
              image_count=${image_count:-0}

              echo "| \`${ACR}/${acr_repo}\` | \`${ECR}/${ecr_repo}\` | ${image_count} |"
            done < <(jq -c '.[]' "$MAPPING_FILE")
          } > README.md

      - name: Commit and push README
        if: always() && inputs.filter_repo == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update migration summary [skip ci]"
          git push
