name: Migrate ACR Images to ECR (Mapping File)

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: 'Number of repositories to migrate in parallel'
        required: false
        default: '10'
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  migrate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Docker Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Install oras
        run: |
          ORAS_VERSION="1.2.3"
          curl -sSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo mv oras /usr/local/bin/

      - name: Migrate images using mapping file
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          ECR="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          MAX_PARALLEL="${{ inputs.max_parallel }}"

          export AZURE_ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          export AWS_REGION_VAR="${{ vars.AWS_REGION }}"
          export ACR_REG="$ACR"
          export ECR_REG="$ECR"

          migrate_repo() {
            local item="$1"
            local acr_repo ecr_repo tags tag_count

            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            echo "==> [${acr_repo}] Fetching tags..."
            tags=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" \
              --repository "${acr_repo}" \
              --output tsv 2>/tmp/acr_err_$$.txt) || true

            if [ -z "$tags" ]; then
              if grep -qi "not found\|does not exist\|repository.*not found\|No repository" /tmp/acr_err_$$.txt 2>/dev/null; then
                echo "WARNING: [${acr_repo}] Repository does not exist in ACR, skipping."
              else
                echo "WARNING: [${acr_repo}] No tags found (repo exists but is empty), skipping."
              fi
              rm -f /tmp/acr_err_$$.txt
              return 0
            fi
            rm -f /tmp/acr_err_$$.txt

            # Ensure ECR repository exists
            aws ecr describe-repositories --repository-names "${ecr_repo}" \
              --region "$AWS_REGION_VAR" > /dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ecr_repo}" \
              --region "$AWS_REGION_VAR" \
              --image-scanning-configuration scanOnPush=true > /dev/null

            tag_count=0
            skipped=0
            failed=0
            for tag in $tags; do
              src="${ACR_REG}/${acr_repo}:${tag}"
              dst="${ECR_REG}/${ecr_repo}:${tag}"

              # Skip if already in ECR
              if aws ecr describe-images \
                  --repository-name "${ecr_repo}" \
                  --image-ids imageTag="${tag}" \
                  --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
                echo "    [${acr_repo}:${tag}] Already in ECR, skipping."
                skipped=$((skipped + 1))
                continue
              fi

              echo "    [${acr_repo}] Migrating :${tag}"
              if oras copy "${src}" "${dst}"; then
                tag_count=$((tag_count + 1))
              else
                echo "ERROR: [${acr_repo}:${tag}] oras copy failed."
                failed=$((failed + 1))
              fi
            done

            echo "==> Done: ${acr_repo} (${tag_count} migrated, ${skipped} skipped, ${failed} failed)"
          }

          export -f migrate_repo

          active=0
          while IFS= read -r item; do
            migrate_repo "$item" &
            active=$((active + 1))
            if [ "$active" -ge "$MAX_PARALLEL" ]; then
              wait -n 2>/dev/null || true
              active=$((active - 1))
            fi
          done < <(jq -c '.[]' acr-ecr-mapping-test.json)

          # Wait for remaining background jobs
          wait
          echo "==> All migrations complete."

      - name: Generate migration summary README
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          ECR="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"

          {
            echo "# ACR → ECR Migration Summary"
            echo ""
            echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| Source ACR Repository | Target ECR Repository | Images in ECR |"
            echo "|---|---|---|"

            cat acr-ecr-mapping-test.json | jq -c '.[]' | while read -r item; do
              acr_repo=$(echo $item | jq -r '.acr_repo')
              ecr_repo=$(echo $item | jq -r '.ecr_repo')

              image_count=$(aws ecr list-images \
                --repository-name "${ecr_repo}" \
                --region ${{ vars.AWS_REGION }} \
                --filter tagStatus=TAGGED \
                --output json 2>/dev/null \
                | jq -r '(.imageIds // []) | length' 2>/dev/null || echo "0")
              image_count=${image_count:-0}

              echo "| \`${ACR}/${acr_repo}\` | \`${ECR}/${ecr_repo}\` | ${image_count} |"
            done
          } > README.md

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update migration summary [skip ci]"
          git push
