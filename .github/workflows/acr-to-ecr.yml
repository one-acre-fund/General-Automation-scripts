name: Migrate ACR Images to ECR (Mapping File)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Docker Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Migrate images using mapping file
        run: |
          cat acr-ecr-mapping.json | jq -c '.[]' | while read -r item; do
            acr_repo=$(echo $item | jq -r '.acr_repo')
            acr_tag=$(echo $item | jq -r '.acr_tag')
            ecr_repo=$(echo $item | jq -r '.ecr_repo')
            ecr_tag=$(echo $item | jq -r '.ecr_tag')
            echo "Migrating $acr_repo:$acr_tag to $ecr_repo:$ecr_tag"
            docker pull ${{ vars.AZURE_ACR_NAME }}.azurecr.io/$acr_repo:$acr_tag
            docker tag ${{ vars.AZURE_ACR_NAME }}.azurecr.io/$acr_repo:$acr_tag ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ecr_repo:$ecr_tag
            docker push ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ecr_repo:$ecr_tag
          done
