name: Migrate ACR Images to ECR (Mapping File)

on:
  workflow_dispatch:
    inputs:
      mapping_file:
        description: 'Mapping JSON file to use'
        required: false
        default: 'acr-ecr-mapping.json'
        type: string
      filter_repo:
        description: 'Migrate only this ACR repo (e.g. openfaas/faas-netes). Leave blank for all.'
        required: false
        default: ''
        type: string
      max_parallel:
        description: 'Number of tags to copy in parallel'
        required: false
        default: '10'
        type: string
      force_recopy:
        description: 'Force re-copy even if tag already exists in ECR (fixes tags previously copied without full image index)'
        required: false
        default: 'false'
        type: string

# ACR is READ-ONLY (source) throughout this workflow.
# Only az acr repository show-tags (list) and oras copy SOURCE pull are used.
# No az acr repository delete, docker push to ACR, or any ACR write command is present.
permissions:
  id-token: write
  contents: write   # needed only to commit the README summary — not related to ACR

jobs:
  migrate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to Azure Container Registry (read-only — pull source images only)
        # ACR is the source. This login is used exclusively for oras copy SOURCE pull.
        # No docker push, az acr repository delete, or any write operation is performed on ACR.
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Docker Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Install oras
        run: |
          ORAS_VERSION="1.2.3"
          curl -sSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo mv oras /usr/local/bin/

      - name: Migrate images using mapping file
        run: |
          ACR="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          ECR="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          MAX_PARALLEL="${{ inputs.max_parallel }}"
          MAPPING_FILE="${{ inputs.mapping_file }}"
          FILTER_REPO="${{ inputs.filter_repo }}"

          export AWS_REGION_VAR="${{ vars.AWS_REGION }}"
          export ACR_REG="$ACR"
          export ECR_REG="$ECR"
          export AZURE_ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          export FORCE_RECOPY="${{ inputs.force_recopy }}"

          WORK_FILE=$(mktemp)
          ERROR_FILE=$(mktemp)
          export ERROR_FILE

          # ── Phase 1: fetch all tags sequentially (avoids ACR rate limiting) ──
          echo "==> Phase 1: Fetching tags from ACR (mapping: ${MAPPING_FILE})..."
          repo_count=0
          skipped_repos=0

          while IFS= read -r item; do
            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            # Apply single-repo filter if set
            if [ -n "$FILTER_REPO" ] && [ "$acr_repo" != "$FILTER_REPO" ]; then
              continue
            fi

            acr_err_tmp=$(mktemp)
            tags=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" \
              --repository "${acr_repo}" \
              --output tsv 2>"$acr_err_tmp") || true

            if [ -z "$tags" ]; then
              if grep -qi "not found\|does not exist\|repository.*not found\|No repository" "$acr_err_tmp" 2>/dev/null; then
                echo "WARNING: [${acr_repo}] Does not exist in ACR, skipping."
              else
                echo "WARNING: [${acr_repo}] No tags found (empty repo), skipping."
              fi
              rm -f "$acr_err_tmp"
              skipped_repos=$((skipped_repos + 1))
              continue
            fi
            rm -f "$acr_err_tmp"

            tag_count=0
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              # Use tab as delimiter — safe for all valid image tag characters
              printf '%s\t%s\t%s\n' "${acr_repo}" "${ecr_repo}" "${tag}" >> "$WORK_FILE"
              tag_count=$((tag_count + 1))
            done <<< "$tags"
            echo "    [${acr_repo}] ${tag_count} tags queued"
            repo_count=$((repo_count + 1))
          done < <(jq -c '.[]' "$MAPPING_FILE")

          total=$(wc -l < "$WORK_FILE" | tr -d ' ')
          echo ""
          echo "==> Phase 1 complete: ${repo_count} repos, ${total} tags queued, ${skipped_repos} repos skipped."

          if [ "$total" -eq 0 ]; then
            echo "Nothing to migrate. Exiting."
            rm -f "$WORK_FILE" "$ERROR_FILE"
            exit 0
          fi

          # ── Pre-create all ECR repos sequentially to avoid parallel race conditions ──
          echo ""
          echo "==> Pre-creating missing ECR repositories..."
          cut -f2 "$WORK_FILE" | sort -u | while IFS= read -r ecr_repo; do
            if ! aws ecr describe-repositories --repository-names "${ecr_repo}" \
                --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
              if aws ecr create-repository --repository-name "${ecr_repo}" \
                  --region "$AWS_REGION_VAR" \
                  --image-scanning-configuration scanOnPush=true > /dev/null 2>&1; then
                echo "    Created ECR repo: ${ecr_repo}"
              else
                echo "WARNING: Could not create ECR repo ${ecr_repo}"
              fi
            fi
          done

          # ── Phase 2: copy tags in parallel ──
          echo ""
          echo "==> Phase 2: Copying tags (parallel=${MAX_PARALLEL})..."

          copy_tag() {
            local acr_repo ecr_repo tag src dst oras_err

            acr_repo=$(printf '%s' "$1" | cut -f1)
            ecr_repo=$(printf '%s' "$1" | cut -f2)
            tag=$(printf '%s' "$1" | cut -f3)
            src="${ACR_REG}/${acr_repo}:${tag}"
            dst="${ECR_REG}/${ecr_repo}:${tag}"

            # Skip if tag already exists in ECR — unless force_recopy is set.
            # force_recopy=true is needed to fix tags previously copied as a single
            # leaf manifest (no image index) rather than a full multi-arch index.
            if [ "${FORCE_RECOPY}" != "true" ]; then
              if aws ecr describe-images \
                  --repository-name "${ecr_repo}" \
                  --image-ids imageTag="${tag}" \
                  --region "$AWS_REGION_VAR" > /dev/null 2>&1; then
                echo "    [${acr_repo}:${tag}] Already in ECR, skipping."
                return 0
              fi
            fi

            echo "    [${acr_repo}] Copying :${tag}..."
            # Full copy: preserves the complete image index (all platforms + OCI artifacts).
            # Each job uses its own temp file to avoid race conditions under parallel execution.
            oras_err=$(mktemp)
            if oras copy "${src}" "${dst}" 2>"$oras_err"; then
              echo "    [${acr_repo}:${tag}] OK"
            else
              msg="ERROR: [${acr_repo}:${tag}] oras copy failed."
              echo "$msg"; cat "$oras_err"
              echo "$msg" >> "$ERROR_FILE"
            fi
            rm -f "$oras_err"
          }

          export -f copy_tag

          active=0
          while IFS= read -r line; do
            copy_tag "$line" &
            active=$((active + 1))
            if [ "$active" -ge "$MAX_PARALLEL" ]; then
              wait -n 2>/dev/null || wait
              active=$((active - 1))
            fi
          done < "$WORK_FILE"

          wait
          rm -f "$WORK_FILE"

          # ── Final summary ──
          echo ""
          echo "========================================"
          if [ -s "$ERROR_FILE" ]; then
            fail_count=$(wc -l < "$ERROR_FILE" | tr -d ' ')
            echo "==> Migration finished with ${fail_count} FAILED tag(s):"
            cat "$ERROR_FILE"
            rm -f "$ERROR_FILE"
            exit 1
          else
            echo "==> All tags migrated successfully."
            rm -f "$ERROR_FILE"
          fi
          echo "========================================"

      - name: Generate ACR vs ECR comparison CSV
        if: always() && inputs.filter_repo == ''
        run: |
          MAPPING_FILE="${{ inputs.mapping_file }}"
          AZURE_ACR_NAME_VAR="${{ vars.AZURE_ACR_NAME }}"
          AWS_REGION_VAR="${{ vars.AWS_REGION }}"
          REPORT_FILE="acr-ecr-comparison-$(date -u '+%Y%m%d-%H%M%S').csv"

          echo "acr_repo,ecr_repo,acr_tags,acr_manifests,ecr_tags,ecr_manifests,tags_match,manifests_match" > "$REPORT_FILE"

          total_repos=0
          mismatch_count=0

          printf '\n%-50s %9s %13s %9s %14s %11s %16s\n' \
            "REPO" "ACR_TAGS" "ACR_MANIFESTS" "ECR_TAGS" "ECR_MANIFESTS" "TAGS_MATCH" "MANIFESTS_MATCH"
          printf '%0.s-' {1..125}; echo

          while IFS= read -r item; do
            acr_repo=$(echo "$item" | jq -r '.acr_repo')
            ecr_repo=$(echo "$item" | jq -r '.ecr_repo')

            # ACR: tagged count
            acr_tags=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME_VAR" \
              --repository "${acr_repo}" \
              --output tsv 2>/dev/null || true)
            if [ -n "$acr_tags" ]; then
              acr_tag_count=$(echo "$acr_tags" | grep -c . || true)
            else
              acr_tag_count=0
            fi

            # ACR: total manifest count (tagged + untagged child manifests from image indexes)
            # --detail is required to enumerate ALL manifests including untagged children of image indexes
            acr_manifest_count=$(az acr repository show-manifests \
              --name "$AZURE_ACR_NAME_VAR" \
              --repository "${acr_repo}" \
              --detail \
              --output json 2>/dev/null \
              | jq 'length // 0' 2>/dev/null || echo 0)
            acr_manifest_count=${acr_manifest_count:-0}

            # ECR: tagged count
            ecr_tag_count=$(aws ecr list-images \
              --repository-name "${ecr_repo}" \
              --region "$AWS_REGION_VAR" \
              --filter tagStatus=TAGGED \
              --output json 2>/dev/null \
              | jq -r '(.imageIds // []) | length' 2>/dev/null || echo 0)
            ecr_tag_count=${ecr_tag_count:-0}

            # ECR: total manifest count (tagged + untagged child manifests)
            # AWS CLI v2 auto-paginates; list-images with tagStatus=ALL counts every manifest
            ecr_manifest_count=$(aws ecr list-images \
              --repository-name "${ecr_repo}" \
              --region "$AWS_REGION_VAR" \
              --filter tagStatus=ANY \
              --output json 2>/dev/null \
              | jq '.imageIds | length // 0' 2>/dev/null || echo 0)
            ecr_manifest_count=${ecr_manifest_count:-0}

            if [ "$acr_tag_count" -eq "$ecr_tag_count" ]; then
              tags_match="YES"
            else
              tags_match="NO"
            fi

            if [ "$acr_manifest_count" -eq "$ecr_manifest_count" ]; then
              manifests_match="YES"
            else
              manifests_match="NO"
            fi

            if [ "$tags_match" != "YES" ] || [ "$manifests_match" != "YES" ]; then
              mismatch_count=$((mismatch_count + 1))
              echo "::warning::MISMATCH [${acr_repo}] ACR tags=${acr_tag_count} manifests=${acr_manifest_count} | ECR tags=${ecr_tag_count} manifests=${ecr_manifest_count}"
            fi

            echo "${acr_repo},${ecr_repo},${acr_tag_count},${acr_manifest_count},${ecr_tag_count},${ecr_manifest_count},${tags_match},${manifests_match}" >> "$REPORT_FILE"
            printf '%-50s %9s %13s %9s %14s %11s %16s\n' \
              "${acr_repo}" "${acr_tag_count}" "${acr_manifest_count}" "${ecr_tag_count}" "${ecr_manifest_count}" "${tags_match}" "${manifests_match}"
            total_repos=$((total_repos + 1))
          done < <(jq -c '.[]' "$MAPPING_FILE")

          echo ""
          echo "========================================"
          echo "Total repos compared : ${total_repos}"
          echo "Repos in sync        : $((total_repos - mismatch_count))"
          echo "Repos with mismatch  : ${mismatch_count}"
          echo "Report saved to      : ${REPORT_FILE}"
          echo "========================================"

          echo "REPORT_FILE=${REPORT_FILE}" >> "$GITHUB_ENV"

          if [ "$mismatch_count" -gt 0 ]; then
            echo "::error::Migration incomplete — ${mismatch_count} repo(s) have mismatched tag counts between ACR and ECR."
            exit 1
          fi

      - name: Commit and push comparison report
        if: always() && inputs.filter_repo == ''
        run: |
          if [ -z "${REPORT_FILE}" ] || [ ! -f "${REPORT_FILE}" ]; then
            echo "No report file found, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${REPORT_FILE}"
          git diff --cached --quiet && echo "Nothing to commit." && exit 0
          git commit -m "chore: add ACR→ECR comparison report ${REPORT_FILE} [skip ci]"
          git pull --rebase
          git push
